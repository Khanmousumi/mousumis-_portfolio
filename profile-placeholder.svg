<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="profilePlaceholderTitle profilePlaceholderDesc">
  <title id="profilePlaceholderTitle">Mousumi Akhter — Mousumi Web Profile Photo Placeholder</title>
  <desc id="profilePlaceholderDesc">Replaceable geometric portrait frame placeholder for Mousumi Akhter, Owner and Web Developer at Mousumi Web.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1e" />
      <stop offset="52%" stop-color="#131c42" />
      <stop offset="100%" stop-color="#0b1730" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#070b1e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#bgGrad)" />
  <rect width="480" height="480" fill="url(#softGlow)" />

  <g stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="480" y2="120" />
    <line x1="0" y1="240" x2="480" y2="240" />
    <line x1="0" y1="360" x2="480" y2="360" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
  </g>

  <circle cx="240" cy="240" r="176" fill="none" stroke="url(#brandGrad)" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="240" cy="240" r="142" fill="none" stroke="#e2e8f0" stroke-opacity="0.12" stroke-width="1" />

  <circle cx="240" cy="186" r="50" fill="#131c3d" stroke="url(#brandGrad)" stroke-width="2.2" />
  <path d="M148 358 C148 296, 188 262, 240 262 C292 262, 332 296, 332 358" fill="#131c3d" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round" />

  <text x="240" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#f8fafc">MA</text>

  <text x="240" y="408" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#cbd5e1">REPLACE WITH PROFILE PHOTO</text>
  <text x="240" y="428" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">assets/images/profile-photo.jpg</text>
</svg>
