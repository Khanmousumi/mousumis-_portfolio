<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="mwLogoTitle">
  <title id="mwLogoTitle">Mousumi Web Emblem</title>
  <defs>
    <linearGradient id="mwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040826" />
      <stop offset="100%" stop-color="#0b164d" />
    </linearGradient>
    <linearGradient id="mwOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="48%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="mwW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#mwBg)" stroke="url(#mwOrbit)" stroke-width="3.5" />

  <!-- Orbiting swoosh inspired by the Mousumi Web banner -->
  <path
    d="M18 68 C16 92, 46 98, 72 78 C98 58, 102 26, 76 24 C60 22, 48 30, 42 36"
    fill="none"
    stroke="url(#mwOrbit)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Stylized lotus petal accent -->
  <path d="M36 32 L41 18 L47 31 Z" fill="#ec4899" />
  <path d="M27 35 L29 22 L38 32 Z" fill="#f472b6" />

  <!-- White 'M' + Gradient 'W' -->
  <path
    d="M27 74 V42 L41 62 L55 42 V74"
    fill="none"
    stroke="#f8fafc"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M55 44 L65 74 L75 50 L85 74 L95 44"
    fill="none"
    stroke="url(#mwW)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pixel accents -->
  <rect x="91" y="22" width="6" height="6" rx="1.2" fill="#22d3ee" />
  <rect x="99" y="28" width="5" height="5" rx="1.2" fill="#a855f7" />
</svg>
